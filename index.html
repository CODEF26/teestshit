<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحليل خطة 2026 | Codef</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary-color: #2c3e50; --accent-color: #3498db; }
        body { font-family: 'Cairo', 'Tajawal', sans-serif; background-color: #f4f7f6; color: var(--primary-color); }
        .kpi-card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; background: #fff; }
        .kpi-card:hover { transform: translateY(-5px); }
        .spinner-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); 
                           display: none; justify-content: center; align-items: center; z-index: 9999; }
        .progress { height: 8px; border-radius: 10px; }
        .table-container { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .main-header { background: linear-gradient(135deg, #2c3e50, #34495e); color: white; padding: 40px 0; border-radius: 0 0 30px 30px; margin-bottom: 30px; }
    </style>
</head>
<body>

<div id="loader" class="spinner-overlay">
    <div class="text-center">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 fw-bold">جاري جلب بيانات الخطة...</p>
    </div>
</div>

<header class="main-header shadow-sm text-center">
    <div class="container">
        <h1 class="fw-bold"><i class="fa-solid fa-chart-pie me-2"></i> لوحة تحليل منجزات 2026</h1>
        <p class="opacity-75">متابعة المستهدفات والتبرعات الشهرية</p>
    </div>
</header>

<div class="container pb-5">
    <div class="row g-3 mb-4" id="kpi-row">
        </div>

    <div class="row">
        <div class="col-lg-12 mb-4">
            <div class="table-container">
                <h5 class="fw-bold mb-4"><i class="fa-solid fa-chart-line text-primary me-2"></i> الأداء الشهري العام</h5>
                <canvas id="yearlyChart" height="100"></canvas>
            </div>
        </div>

        <div class="col-lg-12">
            <div class="table-container">
                <h5 class="fw-bold mb-4"><i class="fa-solid fa-table text-primary me-2"></i> تفاصيل الأشهر (بناءً على الشيتات 1-12)</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>الشهر</th>
                                <th>المستهدف</th>
                                <th>المحقق</th>
                                <th>المتبقي</th>
                                <th>نسبة الإنجاز</th>
                            </tr>
                        </thead>
                        <tbody id="dataTable">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    // تكوين الرابط - استبدله برابط الـ Web App الخاص بك
    const API_URL = "رابط_الـ_WEB_APP_الجديد";

    document.addEventListener('DOMContentLoaded', fetchData);

    async function fetchData() {
        toggleLoader(true);
        try {
            const response = await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "getYearlySummary" })
            });
            const result = await response.json();
            
            if (result.status === "success") {
                renderDashboard(result.data);
            } else {
                throw new Error(result.message);
            }
        } catch (error) {
            Swal.fire('خطأ!', 'فشل في جلب البيانات: ' + error.message, 'error');
        } finally {
            toggleLoader(false);
        }
    }

    function renderDashboard(data) {
        const tableBody = document.getElementById('dataTable');
        const kpiRow = document.getElementById('kpi-row');
        tableBody.innerHTML = '';
        
        let totalT = 0, totalA = 0;
        let labels = [], targets = [], achieved = [];

        data.forEach(m => {
            totalT += m.target;
            totalA += m.achieved;
            labels.push(m.monthName);
            targets.push(m.target);
            achieved.push(m.achieved);

            const pct = (m.achieved / m.target * 100) || 0;
            const statusColor = pct >= 100 ? 'success' : (pct > 50 ? 'primary' : 'warning');

            tableBody.innerHTML += `
                <tr>
                    <td class="fw-bold">${m.monthName}</td>
                    <td>${formatCurrency(m.target)}</td>
                    <td class="text-success fw-bold">${formatCurrency(m.achieved)}</td>
                    <td class="text-danger">${formatCurrency(m.remaining)}</td>
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="progress flex-grow-1 me-2">
                                <div class="progress-bar bg-${statusColor}" style="width: ${Math.min(pct, 100)}%"></div>
                            </div>
                            <small class="fw-bold">${pct.toFixed(1)}%</small>
                        </div>
                    </td>
                </tr>
            `;
        });

        // تحديث بطاقات الـ KPI
        const totalPct = (totalA / totalT * 100) || 0;
        kpiRow.innerHTML = `
            ${createKPICard("إجمالي المستهدف 2026", formatCurrency(totalT), "fa-bullseye", "primary")}
            ${createKPICard("إجمالي المحقق", formatCurrency(totalA), "fa-hand-holding-dollar", "success")}
            ${createKPICard("المتبقي الكلي", formatCurrency(totalT - totalA), "fa-clock", "danger")}
            ${createKPICard("نسبة الإنجاز السنوية", totalPct.toFixed(2) + "%", "fa-percentage", "info")}
        `;

        renderChart(labels, targets, achieved);
    }

    function createKPICard(title, value, icon, color) {
        return `
            <div class="col-md-3">
                <div class="card kpi-card p-3 border-start border-${color} border-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="text-muted small mb-1">${title}</p>
                            <h4 class="fw-bold mb-0">${value}</h4>
                        </div>
                        <i class="fa-solid ${icon} fa-2x text-${color} opacity-25"></i>
                    </div>
                </div>
            </div>
        `;
    }

    function renderChart(labels, targets, achieved) {
        const ctx = document.getElementById('yearlyChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: 'المستهدف', data: targets, backgroundColor: '#e0e0e0', borderRadius: 5 },
                    { label: 'المحقق', data: achieved, backgroundColor: '#3498db', borderRadius: 5 }
                ]
            },
            options: {
                responsive: true,
                plugins: { legend: { position: 'top', labels: { font: { family: 'Cairo' } } } },
                scales: { y: { beginAtZero: true } }
            }
        });
    }

    function formatCurrency(num) {
        return new Intl.NumberFormat('ar-SA', { style: 'currency', currency: 'SAR', maximumFractionDigits: 0 }).format(num);
    }

    function toggleLoader(show) {
        document.getElementById('loader').style.display = show ? 'flex' : 'none';
    }
</script>

</body>
</html>
