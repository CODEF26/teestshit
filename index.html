<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدخال البيانات | Codef</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; }
        .form-card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        .form-header { background: linear-gradient(45deg, #007bff, #0056b3); color: white; padding: 25px; text-align: center; }
        .btn-submit { background-color: #007bff; border: none; padding: 12px; border-radius: 10px; font-weight: bold; transition: 0.3s; }
        .btn-submit:hover { background-color: #0056b3; transform: translateY(-2px); }
        .input-group-text { background-color: #f8f9fa; border-left: none; }
        .form-control { border-right: none; }
        .form-control:focus { box-shadow: none; border-color: #007bff; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card form-card">
                <div class="form-header">
                    <h3 class="mb-0">إضافة سجل جديد</h3>
                    <p class="small mb-0 mt-2">نظام Codef لإدارة البيانات الذكية</p>
                </div>
                <div class="card-body p-4">
                    <form id="dataForm">
                        <div class="mb-3">
                            <label class="form-label">الاسم الكامل</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user text-primary"></i></span>
                                <input type="text" id="name" class="form-control" placeholder="أدخل الاسم" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">رقم الجوال</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-phone text-primary"></i></span>
                                <input type="tel" id="phone" class="form-control" placeholder="05xxxxxxxx" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">الحالة</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-info-circle text-primary"></i></span>
                                <select id="status" class="form-select" required>
                                    <option value="">اختر الحالة...</option>
                                    <option value="مستمر">مستمر</option>
                                    <option value="منقطع">منقطع</option>
                                    <option value="خريج">خريج</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">عدد الأجزاء المحفوظة</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-book-open text-primary"></i></span>
                                <input type="number" id="parts" class="form-control" min="0" max="30" placeholder="0" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 btn-submit" id="submitBtn">
                            حفظ البيانات <i class="fas fa-save ms-1"></i>
                        </button>
                    </form>
                </div>
            </div>
            <p class="text-center mt-4 text-muted small">تطوير بواسطة Codef &copy; 2025</p>
        </div>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzgTvCGyh8L6l2T0f_2FWxvy3JjCGyzEgVdWSvrSJk0wZ_9fy71NKapMEVCMBiwLqMB/exec";

    document.getElementById('dataForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'جاري الحفظ... <i class="fas fa-spinner fa-spin"></i>';

        const payload = {
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            status: document.getElementById('status').value,
            parts: document.getElementById('parts').value
        };

        try {
            // استخدام mode: 'no-cors' إذا واجهت مشاكل في النشر، لكن يفضل التعامل مع JSON
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors', // لضمان العمل مع Google Apps Script بسهولة
                cache: 'no-cache',
                body: JSON.stringify(payload)
            });

            Swal.fire({
                icon: 'success',
                title: 'تم الحفظ بنجاح',
                text: 'تم إضافة البيانات إلى قاعدة البيانات بنجاح.',
                confirmButtonText: 'ممتاز'
            });
            document.getElementById('dataForm').reset();

        } catch (error) {
            Swal.fire('خطأ!', 'حدثت مشكلة أثناء الاتصال بالسيرفر.', 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'حفظ البيانات <i class="fas fa-save ms-1"></i>';
        }
    });
</script>

</body>
</html>
